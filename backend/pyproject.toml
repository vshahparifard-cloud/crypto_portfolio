[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinpulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "redis>=5.2",
  "arq>=0.26",
  "aiogram>=3.15",
  "aiosmtplib>=3.0",
  "jinja2>=3.1",
  # zoneinfo needs a tz database; debian-slim does not ship one, and quiet
  # hours resolve user timezones like Asia/Tehran
  "tzdata>=2024.2",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# RUF001-003 flag "ambiguous" unicode; every Persian user-facing string trips
# them, and Persian is the product's language, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
